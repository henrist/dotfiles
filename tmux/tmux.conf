# Window and pane numbering
set-option -g base-index 1
set-option -g renumber-windows on
set-window-option -g pane-base-index 1

# Create new window in cwd, inserted right after the current one (not at the end).
bind-key c new-window -a -c "#{pane_current_path}"

# Practical creation of new windows with names
bind-key C command-prompt -p "Name of new window: " "new-window -a -n '%%' -c '#{pane_current_path}'"

# Use Vi mode
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Quality-of-life defaults
set-option -g escape-time 10
set-option -g repeat-time 500
set-option -g focus-events on
set-option -g allow-rename off
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Cross-platform clipboard copy (macOS + Linux)
set-option -g @copy_command 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# Mirror every tmux buffer to the attached terminal's clipboard via OSC 52.
# Apps that copy by writing a tmux buffer instead of emitting OSC 52 themselves
# (e.g. grok) otherwise never reach the local clipboard over SSH.
set-option -g @osc52_copy 'b=$(tmux save-buffer - | base64 | tr -d "\n"); tmux list-clients | cut -d: -f1 | while read -r t; do printf "\033]52;c;%s\007" "$b" > "$t"; done'
set-hook -g after-set-buffer 'run-shell -b "#{@osc52_copy}"'
set-hook -g after-load-buffer 'run-shell -b "#{@osc52_copy}"'

# Mouse support
set-option -g mouse on

# More straightforward key bindings for splitting
unbind-key %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key h split-window -h -c "#{pane_current_path}"
unbind-key '"'
bind-key - split-window -v -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Longer history
set-option -g history-limit 50000

# Terminal emulator window title
set-option -g set-titles on
set-option -g set-titles-string '#S:#I.#P #W'

# Terminal capabilities
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ',xterm*:RGB'

# Status bar
set-option -g status-style bg=#131721,fg=#8a9099
set-option -g status-interval 1
set-option -g status-left '#[fg=#59c2ff]#H#[default] '
set-option -g status-left-length 20
set-option -g status-right '#[fg=#8a9099]%Y-%m-%d #[fg=#bfbdb6]%H:%M:%S#[default]'
set-option -g status-right-length 30

# Notify when other windows have activity
set-window-option -g monitor-activity on
set-option -g visual-activity on

# Highlight active window in status bar
set-window-option -g window-status-style fg=#8a9099,bg=default
set-window-option -g window-status-current-style fg=#ffb454,bg=default,bold

# Claude Code's native install runs as a version-numbered binary, so both the
# tree and automatic window names would otherwise read "2.1.220".
set-option -g @cmd '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'
set-window-option -g automatic-rename-format '#{?pane_in_mode,[tmux],#{E:#{@cmd}}}#{?pane_dead,[dead],}'

# tmux seeds every new pane's title with the hostname of the moment, which then
# goes stale (macOS swaps in a DHCP name while the old one sticks in the title).
# Clearing it makes a non-empty title mean an application actually set one.
set-hook -g after-new-session 'select-pane -T ""'
set-hook -g after-new-window 'select-pane -T ""'
set-hook -g after-split-window 'select-pane -T ""'

# Panes that predate the hooks above still hold a seed, and it is whichever name
# the machine answered to back then — macOS reports one when a network hands out
# a DHCP name and LocalHostName.local otherwise, so ask for both.
run-shell -b 'for n in "$(hostname)" "$(scutil --get LocalHostName 2>/dev/null).local"; do tmux list-panes -a -f "##{==:##{pane_title},$n}" -F "##{pane_id}" | while read -r p; do tmux select-pane -t "$p" -T ""; done; done'

# Tree view (prefix w / prefix s): state, name, pane count, cwd, command, title.
# Title is what Claude Code and grok keep updated with their current topic.
set-option -g @tree_path '#[fg=#8a9099]#{p40:#{=/-38/…:#{s|^#{HOME}|~|:pane_current_path}}}'
set-option -g @tree_title '#[fg=#59c2ff]#{=/40/…:#{s|#+\[|[|:pane_title}}'
set-option -g @tree_state '#{?#{==:#{@ai},busy},#[fg=#ffb454]●,#{?#{==:#{@ai},wait},#[fg=#f07178]●,#{?#{==:#{@ai},done},#[fg=#aad94c]●, }}}'
set-option -g @tree_window '#{E:#{@tree_state}} #{?window_active,#[fg=#ffb454#,bold],#{?#{||:#{window_activity_flag},#{window_bell_flag}},#[fg=#f07178],#[fg=#bfbdb6]}}#{p18:#{=/14/…:#{window_name}}#{s|#||:#{window_flags}}} #[fg=#565b66]#{p4:#{?#{>:#{window_panes},1},#{window_panes}p,}}#{E:#{@tree_path}}#[fg=#aad94c]#{p10:#{=/9/…:#{E:#{@cmd}}}}#{E:#{@tree_title}}'
set-option -g @tree_pane '#{?pane_marked,#[reverse],}#{?pane_active,#[fg=#ffb454#,bold],#[fg=#bfbdb6]}#{p23:#{=/21/…:#{E:#{@cmd}}}#{?#{==:#{pane_mode},copy-mode}, [copy],}}#{E:#{@tree_path}}#[fg=#565b66]#{p10:#{pane_width}x#{pane_height}}#{E:#{@tree_title}}'
set-option -g @tree_session '#[fg=#bfbdb6]#{session_windows} window#{?#{==:#{session_windows},1},,s}#{?session_grouped, (group #{session_group}),}#[fg=#aad94c]#{?session_attached, (attached),}'
set-option -g @tree_format '#{?pane_format,#{E:#{@tree_pane}},#{?window_format,#{E:#{@tree_window}},#{E:#{@tree_session}}}}'
set-option -g mode-style 'bg=#253340,fg=#bfbdb6'
# choose-tree splits the pane in half whatever the list holds. Doubling -N sizes
# the list to its content instead, but caps it at a quarter of the height, so it
# is only the better choice while the list still fits in that.
bind-key w run-shell 'n=$(tmux list-windows -a | wc -l); n=$((n + $(tmux list-sessions | wc -l))); [ "$n" -lt $((#{client_height} / 4)) ] && f=-ZwNN || f=-Zw; tmux choose-tree $f -F "##{E:##{@tree_format}}"'
bind-key s run-shell 'n=$(tmux list-sessions | wc -l); [ "$n" -lt $((#{client_height} / 4)) ] && f=-ZsNN || f=-Zs; tmux choose-tree $f -F "##{E:##{@tree_format}}"'

# @ai is optionally set by Claude Code, see install-claude-hooks.sh. Unset means
# no dot; clear a finished window once it has actually been looked at.
set-hook -g pane-focus-in 'if -F "#{==:#{@ai},done}" "set -uw @ai"'

# Let Claude Code / grok emit their own escape sequences (desktop notifications,
# OSC 52) straight to the terminal.
set-option -g allow-passthrough on

# Clock
set-window-option -g clock-mode-colour '#aad94c'
set-window-option -g clock-mode-style 24

# Pane border
set-option -g pane-border-style fg=#1f2430
set-option -g pane-active-border-style fg=#565b66

# Message text
set-option -g message-style bg=#253340,fg=#ffb454

# Pane number display
set-option -g display-panes-active-colour '#ffb454'
set-option -g display-panes-colour '#8a9099'
